<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="408 考研复习资料：操作系统考点分布、历年真题索引与复习优先级。">
  <title>408 考研复习资料</title>
  <style>
    :root { color-scheme: light dark; --paper: #f5f7fa; --card: #ffffff; --ink: #1b232c; --muted: #4c5967; --line: #dae1e9; --accent: #c0392c; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.7; }
    main { max-width: 880px; margin: auto; padding: 72px 24px; }
    .label { margin: 0 0 16px; color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: .16em; }
    h1 { margin: 0 0 16px; font-family: "Songti SC", SimSun, serif; font-size: clamp(30px, 6vw, 48px); line-height: 1.3; }
    .intro { margin: 0; color: var(--muted); font-size: 17px; }
    .divider { margin: 36px 0; border: 0; border-top: 1px solid var(--line); }
    .card { display: block; padding: 28px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .subject { color: var(--accent); font-size: 13px; font-weight: 700; }
    h2 { margin: 10px 0; font-size: 24px; line-height: 1.4; }
    .description { margin: 0; color: var(--muted); }
    .open { display: inline-block; margin-top: 22px; color: var(--accent); font-weight: 600; }
    footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
    @media (max-width: 480px) { main { padding: 44px 20px; } .card { padding: 22px; } }
    @media (prefers-color-scheme: dark) { :root { --paper: #161b23; --card: #1e2530; --ink: #eef2f7; --muted: #b4bfcb; --line: #333d4a; --accent: #ff9284; } }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="label">408 · 计算机学科专业基础</p>
      <h1>408 考研复习资料</h1>
      <p class="intro">从历年真题出发，梳理考点分布与复习重点。</p>
    </header>
    <hr class="divider">
    <a class="card" href="./os.html">
      <span class="subject">操作系统</span>
      <h2>操作系统考点分布表</h2>
      <p class="description">查看考点统计、逐年真题索引与复习优先级，按需筛选和展开考点。</p>
      <span class="open">打开考点分布表 →</span>
    </a>
    <footer>408 学习资料</footer>
  </main>
</body>
</html>
